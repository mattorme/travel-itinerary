name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No API key is available here and none is needed: the pipeline suite runs
      # against fixtures. A test that would call a real provider is a bug.
      - name: Assert no secrets reached the client bundle
        run: |
          npm run build
          if grep -rlE "SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|GOOGLE_MAPS_SERVER_KEY" .next/static 2>/dev/null; then
            echo "::error::A server-only key was inlined into the client bundle"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-key
          OPENAI_API_KEY: ci-openai-key
          GOOGLE_MAPS_SERVER_KEY: ci-google-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: RLS and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      # This is the merge gate for authorisation. If it fails, private trips are
      # reachable by someone they should not be.
      - run: supabase test db

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Run Playwright
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCAL_SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ci-openai-key
          GOOGLE_MAPS_SERVER_KEY: ci-google-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
